<div class="falling-petals-container" [class]="'section-' + section">
  @for (petal of petals; track $index) {
    <div class="petal-container"
         [style.left]="petal.left"
         [style.animationDuration]="petal.fallDuration"
         [style.animationDelay]="petal.fallDelay">
         
      <div class="petal-sway"
           [style.animationDuration]="petal.swayDuration">
           
        <div class="petal-shape" [class]="'petal-' + petal.type"
             [style.transform]="'scale(' + petal.scale + ') rotate(' + petal.rotation + ')'">
             
          @if (petal.type === 'poppy') {
            <!-- Amapola: pétalo rojo orgánico y ancho -->
            <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
              <path fill="#e63946" opacity="0.85" d="M20,38 C10,35 2,25 4,12 C6,2 15,2 20,6 C25,2 34,2 36,12 C38,25 30,35 20,38 Z"/>
              <path fill="#c1121f" opacity="0.7" d="M20,32 C13,30 8,22 9,14 C10,6 16,6 20,9 C24,6 30,6 31,14 C32,22 27,30 20,32 Z"/>
            </svg>
          }
          
          @if (petal.type === 'jasmine') {
            <!-- Jazmín: pétalo blanco/crema alargado -->
            <svg viewBox="0 0 20 40" xmlns="http://www.w3.org/2000/svg">
              <path fill="#ffffff" opacity="0.9" d="M10,38 C2,28 0,15 10,2 C20,15 18,28 10,38 Z"/>
              <path fill="#f1faee" opacity="0.6" d="M10,33 C5,25 4,15 10,5 C16,15 15,25 10,33 Z"/>
            </svg>
          }

          @if (petal.type === 'lavender') {
            <!-- Lavanda: pequeño y lila/morado -->
            <svg viewBox="0 0 16 30" xmlns="http://www.w3.org/2000/svg">
              <path fill="#9b5de5" opacity="0.8" d="M8,28 C2,20 1,10 8,2 C15,10 14,20 8,28 Z"/>
              <path fill="#735d78" opacity="0.9" d="M8,24 C4,18 4,12 8,5 C12,12 12,18 8,24 Z"/>
            </svg>
          }
          
        </div>
      </div>
    </div>
  }
</div>
