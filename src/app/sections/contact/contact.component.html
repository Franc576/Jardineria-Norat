<section id="contacto" class="contact-section" style="position: relative;">
  <app-scroll-plants [section]="'contact'"></app-scroll-plants>
  <div class="contact-container">
    <div class="contact-layout">
      
      <!-- Columna Izquierda: Info de Valor -->
      <div class="contact-info-col">
        <h2 class="contact-title">{{ 'CONTACT.INFO_TITLE' | translate }}</h2>
        <p class="contact-description">
          {{ 'CONTACT.INFO_DESC' | translate }}
        </p>

        <div class="quick-contact-cards">
          <!-- WhatsApp Card -->
          <a href="https://wa.me/34686665840" target="_blank" rel="noopener noreferrer" class="contact-card wa-card">
            <div class="card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
              </svg>
            </div>
            <div class="card-details">
              <span class="card-label">WhatsApp</span>
              <span class="card-value">686 665 840</span>
            </div>
          </a>

          <!-- Email Card -->
          <a href="mailto:noratsalom@gmail.com" class="contact-card email-card">
            <div class="card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 16 16">
                <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z"/>
              </svg>
            </div>
            <div class="card-details">
              <span class="card-label">{{ 'CONTACT.LABEL_EMAIL' | translate }}</span>
              <span class="card-value">noratsalom@gmail.com</span>
            </div>
          </a>
        </div>
      </div>

      <!-- Columna Derecha: Formulario Angular -->
      <div class="contact-form-col">
        <form (ngSubmit)="sendEmail($event, contactForm)" #contactForm="ngForm" class="angular-contact-form">
          <div class="form-row">
            <div class="form-group">
              <label for="form-name">{{ 'CONTACT.LABEL_NAME' | translate }}</label>
              <input
                type="text"
                id="form-name"
                name="name"
                [(ngModel)]="formData.name"
                [placeholder]="'CONTACT.PLACEHOLDER_NAME' | translate"
                required
                #nameInput="ngModel"
                [class.invalid]="nameInput.invalid && nameInput.touched"
              >
            </div>
            <div class="form-group">
              <label for="form-phone">{{ 'CONTACT.LABEL_PHONE' | translate }}</label>
              <input
                type="tel"
                id="form-phone"
                name="phone"
                [(ngModel)]="formData.phone"
                [placeholder]="'CONTACT.PLACEHOLDER_PHONE' | translate"
                required
                #phoneInput="ngModel"
                [class.invalid]="phoneInput.invalid && phoneInput.touched"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="form-email">{{ 'CONTACT.LABEL_EMAIL' | translate }}</label>
            <input
              type="email"
              id="form-email"
              name="email"
              [(ngModel)]="formData.email"
              [placeholder]="'CONTACT.PLACEHOLDER_EMAIL' | translate"
              required
              email
              #emailInput="ngModel"
              [class.invalid]="emailInput.invalid && emailInput.touched"
            >
          </div>

          <div class="form-group">
            <label for="form-message">{{ 'CONTACT.LABEL_MSG' | translate }}</label>
            <textarea
              id="form-message"
              name="message"
              [(ngModel)]="formData.message"
              rows="5"
              [placeholder]="'CONTACT.PLACEHOLDER_MSG' | translate"
              required
              #messageInput="ngModel"
              [class.invalid]="messageInput.invalid && messageInput.touched"
            ></textarea>
          </div>

          <!-- Campo Honeypot para evitar spam de bots (oculto visualmente) -->
          <div class="honey-field" aria-hidden="true">
            <label for="form-bot-address">Address</label>
            <input
              type="text"
              id="form-bot-address"
              name="botAddress"
              [(ngModel)]="formData.botAddress"
              autocomplete="off"
              tabindex="-1"
            >
          </div>

          <div class="form-checkbox-group">
            <label class="checkbox-container">
              <input
                type="checkbox"
                name="privacyAccepted"
                [(ngModel)]="formData.privacyAccepted"
                required
                #privacyInput="ngModel"
              >
              <span class="checkmark"></span>
              <span class="checkbox-text">
                {{ 'CONTACT.PRIVACY_TEXT' | translate }} <a routerLink="/privacidad" class="privacy-link">{{ 'CONTACT.PRIVACY_LINK' | translate }}</a>
              </span>
            </label>
          </div>

          <button
            type="submit"
            class="btn-submit"
            [disabled]="isSending || contactForm.invalid"
          >
            {{ isSending ? ('CONTACT.SENDING' | translate) : ('CONTACT.BTN_SEND' | translate) }}
          </button>

          <!-- Feedback Messages -->
          @if (emailSentSuccess) {
            <div class="form-feedback success">
              {{ 'CONTACT.SUCCESS' | translate }}
            </div>
          }
          @if (emailSentError) {
            <div class="form-feedback error">
              {{ 'CONTACT.ERROR' | translate }}
            </div>
          }
        </form>
      </div>

    </div>
  </div>
</section>
