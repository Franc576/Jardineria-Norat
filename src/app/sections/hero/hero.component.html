<section id="inicio" class="hero-section" #heroContainer>
  <!-- Background Video Loop -->
  <video #bgVideo class="hero-bg-video" autoplay muted loop playsinline [autoplay]="true" [muted]="true" [loop]="true">
    <source src="jardinvideo.mp4" type="video/mp4" />
  </video>
  <div class="hero-video-overlay"></div>

  <!-- Falling Flower Petals -->
  <div class="petals-layer" aria-hidden="true">
    <span class="petal petal-1"></span>
    <span class="petal petal-2"></span>
    <span class="petal petal-3"></span>
    <span class="petal petal-4"></span>
  </div>

  <!-- Central Floating Assembly -->
  <div class="hero-panel-wrapper">
    <div class="hero-panel" #heroPanel>
      <div class="hero-panel-content">
        <span class="hero-panel-label">{{ 'HERO.TITLE' | translate }}</span>
        <h1 class="hero-panel-tagline">{{ 'HERO.TAGLINE' | translate }}</h1>
        <div class="hero-panel-ctas">
          <a href="#contacto" class="hero-btn hero-btn-contact">
            {{ 'HERO.CTA_CONTACT' | translate }}
          </a>
          <a href="#contacto" class="hero-btn hero-btn-budget">
            {{ 'HERO.CTA_BUDGET' | translate }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
