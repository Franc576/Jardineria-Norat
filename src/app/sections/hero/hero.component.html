<section id="inicio" class="hero-section">
  <div class="hero-content">
    <span class="hero-subtitle hero-animate-in">{{ 'HERO.TITLE' | translate }}</span>
    <h1 class="hero-title hero-animate-in">{{ 'HERO.SUBTITLE' | translate }}</h1>
    <p class="hero-description hero-animate-in">
      {{ 'HERO.DESCRIPTION' | translate }}
    </p>
    <a href="#contacto" class="btn-cta hero-animate-in">{{ 'HERO.CTA' | translate }}</a>
  </div>

  <div class="hero-3d-wrapper">
    <canvas #rendererCanvas class="hero-canvas"></canvas>
  </div>
</section>
