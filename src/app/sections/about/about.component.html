<section id="nosotros" class="about-section" style="position: relative;">
  <app-scroll-plants [section]="'about'"></app-scroll-plants>
  <div class="about-container">
    <h2 class="section-title">{{ 'ABOUT.TITLE' | translate }}</h2>
    <div class="about-grid">
      <div class="about-card">
        <p>
          {{ 'ABOUT.P1' | translate }}
        </p>
        <p>
          {{ 'ABOUT.P2' | translate }}
        </p>
      </div>
      <div class="about-image-wrapper">
        <img
          src="WhatsApp-Image-2026-04-06-at-12.06.06.webp"
          [alt]="'ABOUT.ALT_IMG' | translate"
          class="about-img"
          loading="lazy"
        />
      </div>
    </div>
  </div>
</section>
